<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>avatar-engine — captured motion signer</title>
    <style>
      :root {
        --paper: #f2efe9;
        --ink: #16130f;
        --accent: #b4443a;
        --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .caption {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex; justify-content: center;
        padding: 24px 20px 0;
        z-index: 20; pointer-events: none;
        opacity: 0; transform: translateY(-10px);
        transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
      }
      .caption[data-state='active'] { opacity: 1; transform: translateY(0); }
      .caption__box {
        background: var(--accent); color: #fff;
        border-radius: 14px; padding: 12px 26px 10px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(22, 19, 15, 0.16);
      }
      .caption__word { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
      .caption__gloss {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        opacity: 0.75; margin-top: 2px;
      }

      .bar {
        position: fixed; left: 50%; bottom: 26px;
        transform: translateX(-50%);
        width: min(620px, calc(100vw - 40px));
        z-index: 30;
      }
      .bar__row {
        display: flex; gap: 8px; align-items: center;
        background: #fff; border: 1px solid rgba(22, 19, 15, 0.1);
        border-radius: 999px; padding: 8px 8px 8px 22px;
        box-shadow: 0 10px 30px rgba(22, 19, 15, 0.1);
      }
      #text {
        flex: 1; border: 0; outline: 0; background: transparent;
        font: inherit; font-size: 17px; color: var(--ink); padding: 8px 0;
      }
      #sign {
        border: 0; border-radius: 999px; cursor: pointer;
        background: var(--accent); color: #fff;
        font: inherit; font-weight: 600; padding: 11px 26px;
        transition: opacity 0.2s var(--ease);
      }
      #sign:disabled { opacity: 0.45; cursor: default; }

      /* Microphone: quiet until it is listening, then it pulses so there is no
         doubt the mic is live — the one state a user must never be unsure of. */
      #mic {
        display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; flex: 0 0 auto;
        border: 1px solid rgba(22, 19, 15, 0.12);
        border-radius: 999px; cursor: pointer;
        background: transparent; color: rgba(22, 19, 15, 0.55);
        transition: background 0.18s var(--ease), color 0.18s var(--ease),
                    border-color 0.18s var(--ease);
      }
      #mic:hover { background: rgba(22, 19, 15, 0.05); color: var(--ink); }
      #mic[data-listening='true'] {
        background: var(--accent); border-color: var(--accent); color: #fff;
        animation: mic-pulse 1.6s ease-in-out infinite;
      }
      #mic:disabled { opacity: 0.35; cursor: default; }
      @keyframes mic-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(180, 68, 58, 0.45); }
        50%      { box-shadow: 0 0 0 7px rgba(180, 68, 58, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #mic[data-listening='true'] { animation: none; }
      }
      .bar__hint {
        text-align: center; margin-top: 10px;
        font-size: 12.5px; color: rgba(22, 19, 15, 0.5);
      }
      .bar__hint b { color: rgba(22, 19, 15, 0.72); font-weight: 600; }
      #status { min-height: 18px; color: var(--accent); }


      /* Loader + speed control — same classes and look as the .vrma app, so the
         two pipelines feel like one product. */
      .activity {
        position: fixed;
        top: 20px; right: 20px;
        z-index: 30; pointer-events: none;
        opacity: 0; transform: scale(0.92);
        transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
      }
      .activity[data-active='true'] { opacity: 1; transform: scale(1); }
      .activity__spinner {
        width: 28px; height: 28px;
        border: 3px solid rgba(22, 19, 15, 0.12);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: activity-spin 0.7s linear infinite;
      }
      @keyframes activity-spin { to { transform: rotate(360deg); } }

      .speed-control {
        position: fixed;
        right: 20px; bottom: 20px;
        z-index: 10;
        min-width: 56px; padding: 10px 16px;
        font: inherit; font-size: 0.875rem; font-weight: 600;
        letter-spacing: 0.04em; color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid rgba(22, 19, 15, 0.12);
        border-radius: 999px; cursor: pointer;
        box-shadow: 0 1px 2px rgba(22,19,15,0.04), 0 10px 30px -12px rgba(22,19,15,0.22);
        transition: background 0.18s var(--ease), transform 0.18s var(--ease);
      }
      .speed-control:hover { background: #fff; }
      .speed-control:active { transform: scale(0.96); }

      @media (prefers-reduced-motion: reduce) {
        .activity__spinner { animation-duration: 1.4s; }
      }

      /* The speed control is fixed bottom-right and the hint line spans the bar,
         so on narrower windows the hint runs underneath the button. Reserve its
         footprint on the right; wide windows are far apart already and untouched. */
      @media (max-width: 820px) {
        .bar__hint { padding-right: 92px; }
      }

      .badge {
        position: fixed; top: 16px; left: 18px; z-index: 30;
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(22, 19, 15, 0.42);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="badge">captured motion · no .vrma</div>

    <div class="caption">
      <div class="caption__box">
        <div class="caption__word" id="caption"></div>
        <div class="caption__gloss" id="gloss"></div>
      </div>
    </div>

    <div class="bar">
      <div class="bar__row">
        <input id="text" type="text" placeholder="Type a sign…" autocomplete="off" spellcheck="false" />
        <button id="mic" type="button" title="Sign what you say" aria-label="Sign what you say">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path
              d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z M19 11a7 7 0 0 1-14 0 M12 18v3"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="sign" type="button">Sign</button>
      </div>
      <div class="bar__hint">
        <div id="status"></div>
        <div>knows: <b><span id="known"></span></b></div>
      </div>
    </div>

    <script type="module" src="/signer/main.ts"></script>
  </body>
</html>
