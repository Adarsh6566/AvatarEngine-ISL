<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMPL-X experiment — AvatarEngine-ISL</title>
    <!--
      EXPERIMENTAL page. Additive, dev-served (no vite.config change). Renders the
      SAME captured motion as the VRM path on an SMPL-X body, and behaves like
      signer.html: type text, it is translated (Ollama, falling back to the exact
      matcher) and the matched sign(s) play once, in order. Nothing here touches
      the VRM path.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden;
        font: 14px system-ui, sans-serif; background: #33363f; color: #eceaf5; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; top: 14px; left: 16px; pointer-events: none; }
      #signName { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
      #sub { font-size: 12px; color: #a9a8c6; margin-top: 2px; font-family: ui-monospace, monospace; }
      #status { font-size: 12px; color: #e6a64a; margin-top: 6px; min-height: 15px; }
      /* Sign caption, anchored above the avatar's head (positioned by JS each
         frame) and shown only while a sign is playing — like signer.html: the
         typed word being translated on top (large), and below it the library
         gloss it maps to (small, uppercase, dimmed). */
      #caption { position: fixed; left: 0; top: 0; transform: translate(-50%, -115%);
        background: #1d1f30e6; border: 1px solid #3e4180; color: #fff; text-align: center;
        padding: 7px 16px; border-radius: 16px; white-space: nowrap; pointer-events: none;
        opacity: 0; transition: opacity .18s;
        backdrop-filter: blur(6px); box-shadow: 0 8px 24px -10px #000; }
      #caption.show { opacity: 1; }
      #capWord { font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
      #capGloss { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .16em; opacity: .72; margin-top: 3px; }
      #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        background: #1d1f30; border: 1px solid #3a3d58; border-radius: 10px;
        padding: 14px 18px; max-width: 460px; line-height: 1.5; display: none; }
      #msg code { color: #e6a64a; }
      #known { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%);
        max-width: 78vw; text-align: center; font-size: 11.5px; color: #8f93b8;
        font-family: ui-monospace, monospace; pointer-events: none; }
      #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center; background: #1d1f30cc;
        border: 1px solid #3a3d58; border-radius: 14px; padding: 8px 10px; backdrop-filter: blur(6px); }
      #text { font: inherit; color: #eceaf5; background: #2a2c63; border: 1px solid #3e4180;
        border-radius: 8px; padding: 8px 12px; width: 260px; }
      #text::placeholder { color: #8f93b8; }
      #signBtn { font: inherit; color: #eceaf5; background: #33357a; border: 1px solid #3e4180;
        border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
      #signBtn:hover { background: #3d3fa0; }
      /* The corner speed widget from PlaybackSpeedControl positions itself here;
         this page styles the .speed-control trigger, as index/signer do. */
      .speed-control { position: fixed; right: 16px; bottom: 18px; z-index: 20;
        font: inherit; font-family: ui-monospace, monospace; color: #eceaf5;
        background: #1d1f30cc; border: 1px solid #3a3d58; border-radius: 999px;
        padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; }
      .speed-control:hover { background: #2a2c63; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><div id="signName">—</div><div id="sub">SMPL-X · experiment</div><div id="status"></div></div>
    <div id="caption"><div id="capWord"></div><div id="capGloss"></div></div>
    <div id="msg"></div>
    <div id="known"></div>
    <div id="bar">
      <input id="text" type="text" placeholder="Type a sign… (e.g. hello, thank you)" autocomplete="off" spellcheck="false" />
      <button id="signBtn" title="Sign">Sign</button>
    </div>
    <script type="module" src="/smplx/main.ts"></script>
  </body>
</html>
