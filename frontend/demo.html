<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>avatar-engine — phone demo</title>
    <!--
      Presentation shell: the app in a phone-shaped frame, for projecting.

      The product is built for a cheap Android phone, and a talk about it should
      show that shape rather than a maximised desktop window. This is the honest
      way to do that from a laptop: a real 375x812 viewport in an iframe, running
      the real pages off the same origin. Nothing is mocked and nothing is
      screenshotted — what appears inside the frame is the app, at the size it
      was designed for.

      Deliberately NOT devtools' device toolbar, which shows its own chrome and
      a URL bar on the projector.

      The frame scales with the window so it fills a projector without the page
      scrolling, and scaling is a CSS transform on the OUTSIDE of the iframe, so
      the app still believes it is 375 wide and lays itself out accordingly.

      Keys: 1/2/3 switch page, r reloads the frame, f hides the chrome.
    -->
    <style>
      :root {
        --stage: #d9d5cc;
        --stage-2: #c9c4b9;
        --bezel: #1c1b19;
        --ink: #2a2823;
        --ink-soft: #6b665c;
        --chip: #ffffff;
        --chip-on: #2a2823;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --stage: #17171a;
          --stage-2: #101013;
          --bezel: #000000;
          --ink: #e8e4dc;
          --ink-soft: #8b867c;
          --chip: #26262b;
          --chip-on: #e8e4dc;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--stage) 0%, var(--stage-2) 100%);
        color: var(--ink);
        font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px;
        transition: opacity 160ms ease;
      }
      body[data-chrome='off'] header { display: none; }

      button {
        font: inherit;
        color: var(--ink);
        background: var(--chip);
        border: 1px solid rgb(0 0 0 / 0.08);
        border-radius: 999px;
        padding: 7px 15px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
      }
      button[aria-pressed='true'] {
        background: var(--chip-on);
        color: var(--stage);
        border-color: transparent;
      }
      button:focus-visible { outline: 2px solid #b0451f; outline-offset: 2px; }
      .hint { color: var(--ink-soft); font-size: 12px; margin-left: 10px; }

      /* The stage centres the phone and scales it to whatever room is left. */
      .stage {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 0 0 18px;
      }
      /* transform: scale() paints smaller but leaves the LAYOUT box at full
         size, which left the shell carrying ~170px of hidden overflow and threw
         the centring off on short windows. The fitbox carries the scaled size so
         layout and paint agree. */
      .fitbox {
        width: calc(397px * var(--k, 1));
        height: calc(834px * var(--k, 1));
      }
      .phone {
        /* 375x812 plus 11px of bezel each side, scaled as one unit by --k. */
        width: 375px;
        height: 812px;
        transform: scale(var(--k, 1));
        transform-origin: top left;
        border-radius: 44px;
        padding: 11px;
        background: var(--bezel);
        box-shadow:
          0 0 0 2px rgb(255 255 255 / 0.06) inset,
          0 30px 70px -20px rgb(0 0 0 / 0.55),
          0 8px 20px -8px rgb(0 0 0 / 0.35);
        position: relative;
      }
      /* Speaker slot — enough to read as a phone, not a photoreal mockup. */
      .phone::after {
        content: '';
        position: absolute;
        top: 21px;
        left: 50%;
        translate: -50% 0;
        width: 56px;
        height: 5px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.18);
        pointer-events: none;
        z-index: 2;
      }
      iframe {
        width: 375px;
        height: 812px;
        border: 0;
        border-radius: 34px;
        display: block;
        background: #f2efe9;
      }
      @media (prefers-reduced-motion: reduce) {
        header { transition: none; }
      }
    </style>
  </head>
  <body data-chrome="on">
    <header>
      <button type="button" data-page="/signer.html" aria-pressed="true">Signer</button>
      <button type="button" data-page="/lecture.html" aria-pressed="false">Lecture</button>
      <button type="button" data-page="/index.html" aria-pressed="false">Authored</button>
      <span class="hint">1 · 2 · 3 switch · r reload · f full</span>
    </header>

    <div class="stage">
      <div class="fitbox"><div class="phone"><iframe id="screen" src="/signer.html" title="avatar-engine on a phone-sized viewport"></iframe></div></div>
    </div>

    <script type="module">
      const frame = document.getElementById('screen');
      const stage = document.querySelector('.stage');
      const fitbox = document.querySelector('.fitbox');
      const buttons = [...document.querySelectorAll('button[data-page]')];

      /* Scale the phone to the space the stage actually has, never past 1:1 —
         blowing a 375px layout up to 600 would misrepresent how it looks. */
      const fit = () => {
        const box = stage.getBoundingClientRect();
        const k = Math.min(box.width / 397, box.height / 834, 1);
        fitbox.style.setProperty('--k', k.toFixed(4));
      };
      new ResizeObserver(fit).observe(stage);
      fit();

      const show = (page) => {
        // Assigning src (not location) keeps each page a separate history entry
        // of the iframe only, so the shell itself never navigates away.
        frame.src = page;
        for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.page === page));
      };
      for (const b of buttons) b.addEventListener('click', () => show(b.dataset.page));

      addEventListener('keydown', (e) => {
        // Only a text field should swallow these. Testing for document.body
        // meant the shortcuts died the moment a button took focus.
        if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const at = { '1': 0, '2': 1, '3': 2 }[e.key];
        if (at !== undefined) show(buttons[at].dataset.page);
        else if (e.key === 'r') frame.src = frame.src;
        // The header collapses rather than fades, so the ResizeObserver on the
        // stage fires and the phone takes the reclaimed height.
        else if (e.key === 'f') document.body.dataset.chrome =
          document.body.dataset.chrome === 'on' ? 'off' : 'on';
      });
    </script>
  </body>
</html>
