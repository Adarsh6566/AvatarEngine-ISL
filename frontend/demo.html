<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>avatar-engine — phone demo</title>
    <!--
      Presentation shell: the app running as a HANDSET, for projecting.

      The product is built for a cheap Android phone, and a talk about it should
      show that, not a maximised desktop window. The app inside is real — a true
      375-wide viewport in a same-origin iframe, the actual pages, nothing mocked
      and nothing screenshotted. What this file adds is the device around it, so
      the audience reads it as a phone being used rather than a website in a
      phone-shaped picture frame:

        - the pointer becomes a FINGERTIP over the screen. The desktop cursor is
          hidden inside the iframe and a translucent disc tracks it instead,
          pressing smaller and darker on pointerdown, with a tap ripple. This is
          the single change that makes it read as touch,
        - a status bar with a live clock, and a home indicator, in their own
          strips. Capacitor renders web content BELOW the status bar unless it is
          asked for edge-to-edge, so putting them in strips rather than floating
          them over the app is what the APK actually looks like — and it avoids
          covering the pages' own top chrome, which an overlay would,
        - pages are switched from a TAB BAR inside the device, the way an app
          does it. It lives in the shell rather than in any page, so it survives
          a page load and stays put while the content under it changes — which
          is what a native tab bar does and what three buttons floating above a
          picture of a phone never did,
        - the app therefore gets 375x716, which is a real handset content area.

      Deliberately NOT devtools' device toolbar, which puts its own chrome and a
      URL bar on the projector.

      Scaling is a CSS transform on the OUTSIDE of the iframe, so the app still
      believes it is 375 wide and lays itself out accordingly.

      There is no chrome outside the device: the phone is the whole interface,
      so it takes the full height of the window on a projector. 1/2/3 and r
      still work for a presenter who would rather not aim at a tab.
    -->
    <style>
      :root {
        --stage: #d9d5cc;
        --stage-2: #c9c4b9;
        --bezel: #1c1b19;
        --ink: #2a2823;
        --ink-soft: #6b665c;
        --chip: #ffffff;
        --chip-on: #2a2823;
        /* The app's own paper, so the device strips match what it renders. */
        --app-paper: #f2efe9;
        --app-ink: #2a2823;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --stage: #17171a;
          --stage-2: #101013;
          --bezel: #000000;
          --ink: #e8e4dc;
          --ink-soft: #8b867c;
          --chip: #26262b;
          --chip-on: #e8e4dc;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        background: radial-gradient(120% 90% at 50% 0%, var(--stage) 0%, var(--stage-2) 100%);
        color: var(--ink);
        font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      .stage { display: grid; place-items: center; min-height: 0; padding: 18px; }
      /* transform: scale() paints smaller but leaves the LAYOUT box at full
         size, which left the shell carrying ~170px of hidden overflow and threw
         the centring off on short windows. The fitbox carries the scaled size so
         layout and paint agree. */
      .fitbox { width: calc(397px * var(--k, 1)); height: calc(834px * var(--k, 1)); }
      .phone {
        /* OUTER size: the 375x812 screen plus 11px of bezel on every side. The
           screen is the number that matters — 375 is the handset width the app
           is laid out for — so the device grows around it rather than the glass
           shrinking to fit a 375 shell, which would have handed the app a 353px
           viewport no real phone has. */
        width: 397px;
        height: 834px;
        transform: scale(var(--k, 1));
        transform-origin: top left;
        border-radius: 44px;
        padding: 11px;
        background: var(--bezel);
        box-shadow:
          0 0 0 2px rgb(255 255 255 / 0.06) inset,
          0 30px 70px -20px rgb(0 0 0 / 0.55),
          0 8px 20px -8px rgb(0 0 0 / 0.35);
        position: relative;
      }
      .phone::after {
        content: '';
        position: absolute;
        top: 21px; left: 50%;
        translate: -50% 0;
        width: 56px; height: 5px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.18);
        pointer-events: none;
        z-index: 4;
      }

      /* The glass: status strip, app, home strip — and the touch layer over all
         three, so the fingertip does not vanish at the edges of the app. */
      .screen {
        position: relative;
        width: 375px;
        height: 812px;
        border-radius: 34px;
        overflow: hidden;
        background: var(--app-paper);
        display: grid;
        /* status · app · home indicator. The tab bar is NOT a row: it floats
           over the app and slides away, so revealing it never resizes the
           iframe. A row would have changed the app's viewport by 52px on every
           reveal, reflowing the page and re-framing lecture's camera each time. */
        grid-template-rows: 28px 1fr 16px;
        /* The fingertip stands in for the pointer everywhere on the glass, not
           just inside the app, or the arrow would reappear over the tab bar. */
        cursor: none;
      }
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 0 20px;
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: var(--app-ink);
        user-select: none;
      }
      .statusbar svg { display: block; }
      .glyphs { display: flex; align-items: center; gap: 5px; }
      iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--app-paper); }
      .tabbar {
        position: absolute;
        left: 0; right: 0;
        bottom: 16px;            /* clear of the home indicator */
        height: 52px;
        z-index: 3;
        translate: 0 100%;
        opacity: 0;
        transition: translate 220ms cubic-bezier(0.22, 0.61, 0.36, 1), opacity 160ms ease;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        align-items: center;
        border-top: 1px solid rgb(42 40 35 / 0.1);
        background: rgb(255 255 255 / 0.55);
        backdrop-filter: blur(12px);
        box-shadow: 0 -8px 24px -12px rgb(22 19 15 / 0.35);
        user-select: none;
      }
      .screen[data-tabs='1'] .tabbar { translate: 0 0; opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .tabbar { transition: opacity 160ms ease; }
      }
      .tab {
        appearance: none;
        border: 0;
        background: none;
        cursor: none;
        display: grid;
        justify-items: center;
        gap: 3px;
        padding: 0;
        color: rgb(42 40 35 / 0.45);
        font: 600 9.5px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: color 140ms ease;
      }
      .tab svg { display: block; }
      .tab[aria-selected='true'] { color: #b0451f; }
      .tab:focus-visible { outline: 2px solid #b0451f; outline-offset: -3px; border-radius: 10px; }

      .homebar { display: grid; place-items: center; user-select: none; }
      .homebar span {
        width: 118px; height: 4px;
        border-radius: 999px;
        background: rgb(42 40 35 / 0.32);
      }

      /* Fingertip. pointer-events:none throughout — it must never eat a click
         meant for the app underneath. */
      .touch {
        position: absolute;
        top: 0; left: 0;
        width: 34px; height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: rgb(42 40 35 / 0.16);
        border: 1.5px solid rgb(42 40 35 / 0.3);
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease, transform 90ms ease, background-color 90ms ease;
        z-index: 5;
        will-change: transform;
      }
      .touch[data-on='1'] { opacity: 1; }
      .touch[data-press='1'] {
        transform: scale(0.68);
        background: rgb(176 69 31 / 0.34);
        border-color: rgb(176 69 31 / 0.55);
      }
      .ripple {
        position: absolute;
        width: 16px; height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        border: 2px solid rgb(176 69 31 / 0.5);
        pointer-events: none;
        z-index: 5;
        animation: tap 480ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }
      @keyframes tap {
        from { transform: scale(0.4); opacity: 0.9; }
        to   { transform: scale(4.2); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .touch { transition: opacity 120ms ease; }
        .ripple { animation-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="fitbox">
        <div class="phone">
          <div class="screen" id="glass">
            <div class="statusbar">
              <span id="clock">9:41</span>
              <span class="glyphs">
                <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true" fill="currentColor">
                  <rect x="0" y="7" width="3" height="4" rx="1" />
                  <rect x="4.5" y="5" width="3" height="6" rx="1" />
                  <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
                  <rect x="13.5" y="0" width="3" height="11" rx="1" opacity="0.35" />
                </svg>
                <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                  <path d="M1 4.1a9 9 0 0 1 13 0" />
                  <path d="M3.6 6.7a5.4 5.4 0 0 1 7.8 0" />
                  <circle cx="7.5" cy="9.4" r="0.9" fill="currentColor" stroke="none" />
                </svg>
                <svg width="25" height="11" viewBox="0 0 25 11" aria-hidden="true">
                  <rect x="0.6" y="0.6" width="20.5" height="9.8" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.45" />
                  <rect x="2.2" y="2.2" width="14.5" height="6.6" rx="1.8" fill="currentColor" />
                  <path d="M22.6 3.9v3.2a2.1 2.1 0 0 0 0-3.2Z" fill="currentColor" fill-opacity="0.5" />
                </svg>
              </span>
            </div>

            <iframe id="app" src="/signer.html" title="avatar-engine on a phone-sized viewport"></iframe>

            <div class="tabbar" role="tablist" aria-label="Pages">
              <button class="tab" type="button" role="tab" data-page="/signer.html" aria-selected="true">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11" />
                  <path d="M12 10.5V4.5a1.5 1.5 0 0 1 3 0V11" />
                  <path d="M15 10.5V6.5a1.5 1.5 0 0 1 3 0V13" />
                  <path d="M9 11V9a1.5 1.5 0 0 0-3 0v5.5c0 3.6 2.6 6.5 6 6.5s6-2.6 6-6.5V13" />
                </svg>
                Signer
              </button>
              <button class="tab" type="button" role="tab" data-page="/lecture.html" aria-selected="false">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2.5" y="5" width="19" height="14" rx="3" />
                  <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none" />
                </svg>
                Lecture
              </button>
              <button class="tab" type="button" role="tab" data-page="/index.html" aria-selected="false">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 18.5 9 5.5l5 13" />
                  <path d="M5.8 14.5h6.4" />
                  <path d="M20 9.5v9" />
                  <path d="M20 5.8v.2" />
                </svg>
                Authored
              </button>
            </div>

            <div class="homebar"><span></span></div>

            <div class="touch" id="touch"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      const frame = document.getElementById('app');
      const stage = document.querySelector('.stage');
      const fitbox = document.querySelector('.fitbox');
      const glass = document.getElementById('glass');
      const touch = document.getElementById('touch');
      const clock = document.getElementById('clock');
      const tabs = [...document.querySelectorAll('.tab')];

      /** Height of the status strip: the iframe's origin inside the glass. */
      const STATUS_H = 28;

      /*
       * Where the tab bar reveals and where it goes away again.
       *
       * A bar parked permanently across the bottom is chrome, not an app: it
       * sits on the content and costs 52px of a 812px screen for something used
       * once a minute. So it hides, and a reach toward the bottom edge brings it
       * back — the same bargain a phone makes with its own navigation.
       *
       * Two thresholds rather than one, because a single line flickers the bar
       * on and off while the pointer sits astride it. Revealing at 730 also puts
       * it on screen just BEFORE the pointer arrives at the bar itself (which
       * occupies 744-796), so it slides up to meet the finger rather than
       * appearing underneath it.
       */
      const REVEAL_BELOW = 730;
      const HIDE_ABOVE = 660;

      /* Scale the phone to the space the stage has, never past 1:1 — blowing a
         375px layout up to 600 would misrepresent how it looks. */
      const fit = () => {
        // The CONTENT box, not the border box. getBoundingClientRect includes
        // the stage's padding, so measuring it there made k too large by the
        // padding and the shell carried real overflow — invisible only because
        // body hides it, and the phone would have been clipped on a short
        // window rather than scaled to fit.
        const cs = getComputedStyle(stage);
        const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const k = Math.min(w / 397, h / 834, 1);
        fitbox.style.setProperty('--k', Math.max(k, 0.1).toFixed(4));
      };
      new ResizeObserver(fit).observe(stage);
      fit();

      const tick = () => {
        const d = new Date();
        clock.textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      tick();
      setInterval(tick, 20_000);

      // --- the fingertip ----------------------------------------------------
      // Coordinates are in the phone's OWN pixels and the disc lives inside the
      // scaled .phone, so the transform carries it for free — no need to undo
      // the scale, which is what makes this correct at every window size.
      const place = (x, y) => {
        touch.style.translate = `${x}px ${y}px`;
        touch.dataset.on = '1';
        if (y >= REVEAL_BELOW) glass.dataset.tabs = '1';
        else if (y <= HIDE_ABOVE) glass.dataset.tabs = '0';
      };
      const ripple = (x, y) => {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.translate = `${x}px ${y}px`;
        glass.append(r);
        r.addEventListener('animationend', () => r.remove(), { once: true });
      };
      const press = (on) => { touch.dataset.press = on ? '1' : '0'; };

      /* Same-origin, so the app's own document can be listened to directly.
         Re-run on every load: switching page replaces the document and takes
         the listeners with it. */
      const wireApp = () => {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        // The desktop arrow would sit next to the fingertip and give the game
        // away, so it goes. Inputs keep a caret; only the pointer is hidden.
        style.textContent = '*, *::before, *::after { cursor: none !important; }';
        doc.head?.append(style);

        doc.addEventListener('pointermove', (e) => place(e.clientX, e.clientY + STATUS_H), { passive: true });
        doc.addEventListener('pointerdown', (e) => {
          press(true);
          ripple(e.clientX, e.clientY + STATUS_H);
        }, { passive: true });
        doc.addEventListener('pointerup', () => press(false), { passive: true });
        doc.addEventListener('pointercancel', () => press(false), { passive: true });
        doc.addEventListener('pointerleave', () => { touch.dataset.on = '0'; press(false); }, { passive: true });
      };
      frame.addEventListener('load', wireApp);
      if (frame.contentDocument?.readyState === 'complete') wireApp();

      // The strips are the parent's, not the app's, so they need their own
      // handlers or the fingertip would blink out crossing them.
      glass.addEventListener('pointermove', (e) => {
        const box = glass.getBoundingClientRect();
        const k = box.width / 375;
        place((e.clientX - box.left) / k, (e.clientY - box.top) / k);
      });
      glass.addEventListener('pointerleave', () => {
        touch.dataset.on = '0';
        press(false);
        glass.dataset.tabs = '0';
      });
      // Events inside the iframe do not bubble out here, so these only ever see
      // the shell's own strips — the tab bar included. Without them a tap on a
      // tab would be the one press in the whole device that gave no feedback.
      glass.addEventListener('pointerdown', (e) => {
        const box = glass.getBoundingClientRect();
        const k = box.width / 375;
        press(true);
        ripple((e.clientX - box.left) / k, (e.clientY - box.top) / k);
      });
      glass.addEventListener('pointerup', () => press(false));

      // --- shell ------------------------------------------------------------
      const show = (page) => {
        if (frame.getAttribute('src') === page) return; // already there: no reload
        frame.src = page;
        for (const t of tabs) t.setAttribute('aria-selected', String(t.dataset.page === page));
        // Put it away on the way out, the way a tab bar does once it has been
        // used — otherwise it hangs over the page you just switched to.
        glass.dataset.tabs = '0';
      };
      for (const t of tabs) t.addEventListener('click', () => show(t.dataset.page));

      // Kept for a presenter who would rather not aim at a tab. Nothing on
      // screen advertises them, because the device is the interface now.
      addEventListener('keydown', (e) => {
        if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const at = { '1': 0, '2': 1, '3': 2 }[e.key];
        if (at !== undefined) show(tabs[at].dataset.page);
        else if (e.key === 'r') frame.src = frame.src;
      });
    </script>
  </body>
</html>
