services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      BACKEND_HOST: "0.0.0.0"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:80}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
